name: Windows Build Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Install Windows Desktop workload
      run: dotnet workload install windowsdesktop
    
    - name: Restore dependencies
      run: |
        dotnet restore AuraClipy.csproj
    
    - name: Build Release
      run: |
        dotnet build AuraClipy.csproj --configuration Release --no-restore
    
    - name: Build Simple Version (Alternative)
      run: |
        echo "Note: AuraClipy.Simple.csproj does not exist in current structure, skipping."
        # dotnet build AuraClipy.Simple.csproj --configuration Release --no-restore
    
    - name: List output files
      run: |
        echo "=== Build Output ==="
        if (Test-Path "bin/Release/net10.0-windows/AuraClipy.exe") {
          echo "✅ Main EXE: bin/Release/net10.0-windows/AuraClipy.exe"
          Get-Item "bin/Release/net10.0-windows/AuraClipy.exe" | Format-List *
        } else {
          echo "❌ Main EXE not found"
        }
        
        echo "Checking for Simple version..."
        # AuraClipy.Simple.csproj nicht vorhanden, daher kein Check
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build-artifacts
        path: |
          bin/Release/net10.0-windows/
        if-no-files-found: warn
    
    - name: Run simple tests (if executable exists)
      run: |
        if (Test-Path "bin/Release/net10.0-windows/AuraClipy.exe") {
          echo "✅ Main EXE exists, would run tests here"
          # Add actual test execution when implemented
        } else {
          echo "⚠️ No executable found for tests"
        }